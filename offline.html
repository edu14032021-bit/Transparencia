<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.55), transparent 34%),
        linear-gradient(135deg, #100f2e, #30206f, #7c3aed);
      color: #fff;
      padding: 22px;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      border-radius: 28px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 22px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(18px);
    }

    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #e0e7ff;
      margin-bottom: 22px;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Sem conexão</h1>
    <p>
      O painel está instalado, mas os sistemas externos precisam de internet para funcionar.
      Verifique sua conexão e tente novamente.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
